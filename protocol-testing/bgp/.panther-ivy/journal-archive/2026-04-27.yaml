    detail: "Option 2 (surgical init-shim) FIXED announce and REPLACE both. One-line\
      \ add to bgp_path_attribute.ivy after init: received_origin_value(C) := 0. Root\
      \ cause confirmed: Z3 was binding received_origin_value(ivy_id) non-deterministically\
      \ at init, making the conditional require f.value = received_origin_value(src)\
      \ in path_attr.origin.handle infeasible for announce's f.value=0. Post-fix:\
      \ announce emits 2 UPDATEs on wire with NLRI 192.168.1.0/24, replace emits 2\
      \ UPDATEs (up from 1 pre-fix), withdraw unaffected. All 3 clean \u2014 0 assertion_failed,\
      \ 0 NOTIFICATIONs, no hold-timer whitelist needed. Two uncommitted changes:\
      \ (1) bgp_path_attribute.ivy init-shim (fix), (2) bgp_speaker_test_update_announce.ivy\
      \ hold_timer_expire removal (hardening)."
    root_cause: uninitialized received_origin_value binding-dependent Z3 encoding
    runs:
      announce_14_56_48: PASS_2_UPDATES
